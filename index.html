<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>宝石商人 P2P Private</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="cards.js"></script>
    <script src="engine.js"></script>
    <style>
        body { background: #121212; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        #game-area { display: none; width: 1000px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .card { width: 120px; height: 160px; background: #fff; color: #333; border-radius: 5px; padding: 10px; cursor: pointer; font-size: 12px; }
        .noble { width: 100px; height: 100px; background: #f1c40f; color: #000; }
        .gem-bank { display: flex; gap: 10px; margin: 20px 0; }
        .gem-btn { padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; border: none; }
        .white { background: #fff; } .blue { background: #3498db; } .green { background: #2ecc71; } .red { background: #e74c3c; } .black { background: #333; color: #fff; }
        .player-box { background: #252525; padding: 15px; border-radius: 5px; min-width: 150px; border: 2px solid transparent; }
        .active-p { border-color: #f1c40f; }
        button { padding: 10px 20px; cursor: pointer; background: #bb86fc; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="setup" class="panel">
        <h2 id="role-hint">加载中...</h2>
        <input type="text" id="room-id" placeholder="输入房间号">
        <button onclick="connect()">确定进入</button>
        <div id="wait-msg" style="display:none; margin-top:15px;">
            已加入: <span id="p-count">1</span>/4
            <button id="start-btn" onclick="hostStart()" style="display:none;">正式开始</button>
        </div>
    </div>

    <div id="game-area">
        <div class="row" id="noble-row"></div>
        <div id="market-board">
            <div class="row" id="tier3"></div>
            <div class="row" id="tier2"></div>
            <div class="row" id="tier1"></div>
        </div>
        <div class="gem-bank" id="bank-ui"></div>
        <div id="turn-display" style="font-size: 20px; color: gold; margin-bottom: 10px;"></div>
        <button onclick="sendAction({type:'END'})">结束回合</button>
        <div class="row" id="players-ui" style="margin-top:20px;"></div>
    </div>

<script>
    const isHost = new URLSearchParams(window.location.search).get('role') === 'host';
    let peer, conn, myId, connections = [];

    document.getElementById('role-hint').innerText = isHost ? "👑 创建房间" : "🎮 加入游戏";

    function connect() {
        const rid = document.getElementById('room-id').value;
        peer = isHost ? new Peer(rid) : new Peer();
        peer.on('open', (id) => {
            myId = id;
            document.getElementById('setup').style.background = "#2e7d32";
            document.getElementById('wait-msg').style.display = "block";
            if(isHost) {
                document.getElementById('start-btn').style.display = "inline";
                addPlayer(myId);
            } else {
                conn = peer.connect(rid);
                listen(conn);
            }
        });
        peer.on('connection', (c) => {
            connections.push(c);
            listen(c);
            addPlayer(c.peer);
            broadcast();
        });
    }

    function listen(c) {
        c.on('data', (d) => {
            if(d.type === 'S') { gameState = d.data; render(); }
            if(d.type === 'A' && isHost) handle(d.act);
        });
    }

    function addPlayer(id) {
        if(!gameState.players.find(p => p.id === id)) {
            gameState.players.push({ id, score: 0, gems: {white:0,blue:0,green:0,red:0,black:0}, bonus: {white:0,blue:0,green:0,red:0,black:0} });
        }
    }

    function hostStart() {
        const limit = getGemLimit(gameState.players.length);
        ['white','blue','green','red','black'].forEach(c => gameState.bank[c] = limit);
        gameState.decks.tier1 = shuffle([...FULL_CARD_POOL.level1]);
        gameState.decks.tier2 = shuffle([...FULL_CARD_POOL.level2]);
        gameState.decks.tier3 = shuffle([...FULL_CARD_POOL.level3]);
        gameState.market.tier1 = gameState.decks.tier1.splice(0, 4);
        gameState.market.tier2 = gameState.decks.tier2.splice(0, 4);
        gameState.market.tier3 = gameState.decks.tier3.splice(0, 4);
        gameState.nobles = shuffle([...FULL_CARD_POOL.nobles]).splice(0, gameState.players.length + 1);
        gameState.started = true;
        broadcast();
    }

    function handle(act) {
        let p = gameState.players[gameState.turn];
        if(act.uid !== p.id) return;
        if(act.type === 'G' && gameState.gemsTaken < 3) {
            if(gameState.bank[act.c] > 0) { gameState.bank[act.c]--; p.gems[act.c]++; gameState.gemsTaken++; }
        } else if(act.type === 'B') {
            const card = gameState.market[act.t][act.i];
            if(canAfford(p, card)) {
                for(let c in card.cost) {
                    const pay = Math.max(0, card.cost[c] - (p.bonus[c]||0));
                    p.gems[c] -= pay; gameState.bank[c] += pay;
                }
                p.bonus[card.bonus]++; p.score += card.points;
                gameState.market[act.t][act.i] = gameState.decks[act.t].pop() || null;
                finishTurn();
            }
        } else if(act.type === 'END') { finishTurn(); }
        broadcast();
    }

    function finishTurn() {
        checkNobles(gameState.players[gameState.turn]);
        gameState.turn = (gameState.turn + 1) % gameState.players.length;
        gameState.gemsTaken = 0;
    }

    function broadcast() { connections.forEach(c => c.send({type:'S', data:gameState})); render(); }
    function sendAction(a) { a.uid = myId; if(isHost) handle(a); else conn.send({type:'A', act:a}); }

    function render() {
        if(!gameState.started) { document.getElementById('p-count').innerText = gameState.players.length; return; }
        document.getElementById('setup').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';

        const drawRow = (id, tier) => {
            let h = `<div style="color:gray; width:50px">${tier}</div>`;
            gameState.market[tier].forEach((c, i) => {
                if(!c) return;
                h += `<div class="card" onclick="sendAction({type:'B', t:'${tier}', i:${i}})">
                    <b style="font-size:18px">${c.points}</b> <div class="${c.bonus}" style="height:15px"></div>
                    <div style="margin-top:40px">${JSON.stringify(c.cost)}</div>
                </div>`;
            });
            document.getElementById(id).innerHTML = h;
        };
        drawRow('tier1', 'tier1'); drawRow('tier2', 'tier2'); drawRow('tier3', 'tier3');

        let bHtml = '';
        for(let c in gameState.bank) bHtml += `<button class="gem-btn ${c}" onclick="sendAction({type:'G', c:'${c}'})">${gameState.bank[c]}</button>`;
        document.getElementById('bank-ui').innerHTML = bHtml;

        let pHtml = '';
        gameState.players.forEach((p, i) => {
            pHtml += `<div class="player-box ${i===gameState.turn?'active-p':''}">
                P${i+1} (${p.score}pt)<br><small>加成: ${JSON.stringify(p.bonus)}</small><br><small>宝石: ${JSON.stringify(p.gems)}</small>
            </div>`;
        });
        document.getElementById('players-ui').innerHTML = pHtml;
        document.getElementById('turn-display').innerText = gameState.players[gameState.turn].id === myId ? "YOUR TURN" : "WAITING...";
    }
</script>
</body>
</html>
